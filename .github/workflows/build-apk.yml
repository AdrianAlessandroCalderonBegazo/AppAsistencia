name: build android apk

# Compila el APK de la app del empleado sin necesidad de tener Flutter/Android SDK
# instalados localmente. El resultado queda como artifact descargable en la ejecución
# del workflow (pestaña "Actions" del repo).
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL del backend, ej. https://asistencia-backend.onrender.com/api"
        required: false
  push:
    branches: [main]
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      # Versión fija (no "stable", que cambia sola) para no perseguir versiones de
      # Gradle/AGP cada vez que Flutter saca un release nuevo — esta es la misma
      # versión ya validada localmente (flutter analyze / test / build web).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      - name: build apk
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL || 'http://localhost:3000/api' }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: asistencia-empleado-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
